<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q&A Detector & AI Auto Solver</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Q&A Detector & AI</h1>
          <p class="brand-subtitle">Key4U GPT-5.5 Auto-Solver</p>
        </div>
      </div>
      <div class="header-right">
        <div class="counter-badge" id="counterBadge" title="Tổng số câu hỏi đã phát hiện">
          <span id="questionCount">0</span> câu
        </div>
        <button id="btnToggleSettings" class="btn-icon" title="Cài đặt API Key & Model">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Action Bar -->
    <div class="action-bar">
      <button id="btnScanAI" class="btn btn-ai-scan" style="flex: 1;" title="Dùng AI (gpt-5.4-nano) bóc tách toàn bộ cấu trúc bài đọc, đề bài & options chuẩn 100%">
        <svg class="icon-ai-spin" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"></path>
          <circle cx="12" cy="12" r="4"></circle>
        </svg>
        <span>🧠 Quét bằng AI</span>
      </button>

      <button id="btnSolveAll" class="btn btn-ai" style="flex: 1.2;" title="Dùng AI giải toàn bộ và tự động chọn đáp án trên web">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
        </svg>
        <span>✨ AI Giải & Tự Chọn</span>
      </button>
    </div>

    <!-- Collapsible Settings Panel -->
    <div id="settingsPanel" class="settings-panel hidden">
      <div class="setting-title">Cấu hình Key4U AI Solver</div>
      
      <div class="form-group">
        <label for="txtApiKey">Key4U API Key:</label>
        <div class="input-with-btn">
          <input type="password" id="txtApiKey" value="sk-oHL29VmqcUURTnx0qwUeJJ4uoLMu38hQ5CxsTqkcFLUAi2m5" placeholder="Nhập API key Key4U của bạn...">
          <button id="btnSaveKey" class="btn btn-sm btn-primary">Lưu</button>
        </div>
        <div style="font-size: 11px; color: #94a3b8; margin-top: 6px; display: flex; align-items: center; gap: 4px;">
          <span>⚡ Phím tắt tự giải bài:</span>
          <kbd style="background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-weight: 600; color: #a5b4fc;">Alt + H</kbd>
        </div>
      </div>

      <div class="form-group">
        <label for="txtModel">Model AI Giải đề:</label>
        <input type="text" id="txtModel" value="gpt-5.4-nano" placeholder="gpt-5.4-nano, gpt-5.6-luna, gpt-5.5...">
      </div>

      <div class="form-group">
        <label for="txtModelDetect">Model AI Bóc tách Cấu trúc:</label>
        <input type="text" id="txtModelDetect" value="gpt-5.4-nano" placeholder="gpt-5.4-nano, gpt-5.6-luna...">
      </div>

      <div class="setting-item">
        <label class="switch-label">
          <input type="checkbox" id="chkAutoSelectWeb" checked>
          <span class="slider"></span>
          <span>Tự động click chọn đáp án trên trang web</span>
        </label>
      </div>
    </div>

    <!-- Filter & Search Bar -->
    <div id="filterSection" class="filter-section hidden">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Tìm kiếm câu hỏi...">
      </div>
    </div>

    <!-- Main Content / Results Area -->
    <main class="results-container" id="resultsContainer">
      <!-- Empty State -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <h3>Sẵn sàng quét câu hỏi</h3>
        <p>Bấm nút <strong>"Quét trang"</strong> hoặc <strong>"AI Giải & Tự Chọn"</strong> để tự động bóc tách và tích đáp án trực tiếp trên web.</p>
      </div>

      <!-- Question List Container -->
      <div class="questions-list" id="questionsList"></div>
    </main>

    <!-- Footer Actions (Copy & Export) -->
    <footer class="app-footer" id="appFooter">
      <div class="export-group">
        <button id="btnCopyMarkdown" class="btn btn-outline btn-sm" title="Sao chép Markdown">
          <span>Markdown</span>
        </button>
        <button id="btnCopyJson" class="btn btn-outline btn-sm" title="Sao chép JSON">
          <span>JSON</span>
        </button>
        <button id="btnCopyText" class="btn btn-outline btn-sm" title="Sao chép văn bản thuần">
          <span>Văn bản</span>
        </button>
        <button id="btnDownload" class="btn btn-outline btn-sm" title="Tải file .txt">
          <span>Tải file</span>
        </button>
      </div>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">Đã sao chép vào bộ nhớ đệm!</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
