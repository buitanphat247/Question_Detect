<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Translate</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="gt-container">
    <!-- HEADER -->
    <div class="gt-header">
      <div class="gt-logo">
        <svg class="gt-icon-svg" viewBox="0 0 24 24" width="22" height="22">
          <path fill="#1a73e8" d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/>
        </svg>
        <span class="gt-title">
          <span class="g-blue">Language</span>
          <span class="gt-sub">Translate</span>
        </span>
      </div>
      <div class="gt-status-badge">
        <span class="gt-dot online"></span>
        <span class="gt-version">v2.0.18</span>
      </div>
    </div>

    <!-- LANGUAGE BAR -->
    <div class="gt-lang-bar">
      <span class="gt-lang active">Phát hiện ngôn ngữ</span>
      <span class="gt-swap-icon">⇄</span>
      <span class="gt-lang active">Tiếng Việt</span>
    </div>

    <!-- MAIN ACTIONS -->
    <div class="gt-section">
      <div class="gt-actions-grid">
        <button id="btnContinuous" class="gt-btn gt-btn-primary">
          <span>DỊCH TOÀN BỘ TRANG (Alt + K)</span>
        </button>
        <button id="btnSingle" class="gt-btn gt-btn-outline">
          <span>Dịch 1 câu hiện tại (Phím N)</span>
        </button>
        <button id="btnSnip" class="gt-btn gt-btn-outline">
          <span>Dịch vùng ảnh chọn (Phím Y)</span>
        </button>
      </div>

      <div class="gt-shortcuts-box">
        <div class="gt-shortcut-row">
          <span class="gt-key">Phím N</span>
          <span class="gt-desc">Dịch & tích 1 câu (Không qua trang)</span>
        </div>
        <div class="gt-shortcut-row">
          <span class="gt-key">Alt + K</span>
          <span class="gt-desc">Dịch liên tiếp & tự qua trang</span>
        </div>
        <div class="gt-shortcut-row">
          <span class="gt-key">Phím Y</span>
          <span class="gt-desc">Dịch ảnh / bảng biểu vùng chọn</span>
        </div>
        <div class="gt-shortcut-row">
          <span class="gt-key">Phím ESC</span>
          <span class="gt-desc">Dừng tiến trình dịch</span>
        </div>
      </div>

      <div class="gt-footer-links">
        <a href="https://translate.google.com" target="_blank" class="gt-link">Language Translate</a>
        <span class="gt-sep">•</span>
        <span class="gt-text-green">Sẵn sàng hoạt động</span>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
